# Netlify hosts only the scanner page (the Telegram Mini App).
# The bot itself runs on your PC.
[build]
  publish = "webapp"
  command = ""
  # only rebuild when the scanner page changed (bot-only commits don't use up Netlify build credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- webapp/"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
